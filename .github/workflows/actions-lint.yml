name: Actions Lint

on:
  push:
    branches: [main, develop]
    paths:
      - .github/**
  pull_request:
    paths:
      - .github/**
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PINACT_VERSION: 5.0.2
      PINACT_SHA256: 7f003d8f51e984c2264d2009d430e3e0e87ae404a0e2dc2a9a277b0f731bf5b7
      ZIZMOR_VERSION: 1.31.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinact
        run: |
          curl -fsSLo "$RUNNER_TEMP/pinact.tar.gz" "https://github.com/suzuki-shunsuke/pinact/releases/download/v${PINACT_VERSION}/pinact_linux_amd64.tar.gz"
          echo "${PINACT_SHA256}  $RUNNER_TEMP/pinact.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pinact.tar.gz" -C "$RUNNER_TEMP" pinact

      - name: Check that every action is pinned to a full SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/pinact" run --check'

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .github
